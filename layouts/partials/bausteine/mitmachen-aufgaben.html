{{- /*
  Was man bei NCWiki machen kann: Karten aus dem Frontmatter der Seite
  (aufgaben: mit je titel und text), wie die drei Punkte auf der Startseite.
*/ -}}
{{- with .Params.aufgaben }}
<div class="feature-grid mitmachen-aufgaben">
  {{- range . }}
  <div class="feature"><span class="num" aria-hidden="true"></span><h3>{{ .titel }}</h3><p>{{ .text }}</p></div>
  {{- end }}
</div>
{{- end }}
