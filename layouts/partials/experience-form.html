{{- $years := slice 2027 2026 2025 2024 2023 2022 2021 2020 }}

<form class="contact-form experience-form" action="https://formspree.io/f/xaewqwoj" method="POST" novalidate>
  <div>
    <label for="ef-name">{{ i18n "experience_form_display_name" }}</label>
    <input type="text" name="display_name" id="ef-name" required>
    <p class="form-hint">{{ i18n "experience_form_display_name_hint" }}</p>
  </div>
  <div>
    <label for="ef-email">{{ i18n "form_email" }}</label>
    <input type="email" name="email" id="ef-email" required>
    <p class="form-hint">{{ i18n "experience_form_email_hint" }}</p>
  </div>
  <div>
    <label for="ef-year">{{ i18n "ems_year_label" }}</label>
    <select name="ems_jahr" id="ef-year" required>
      <option value="" disabled selected>{{ i18n "experience_form_year_placeholder" }}</option>
      {{ range $years }}<option value="{{ . }}">{{ . }}</option>{{ end }}
      <option value="{{ i18n "experience_form_year_earlier" }}">{{ i18n "experience_form_year_earlier" }}</option>
    </select>
  </div>
  <div>
    <label for="ef-uni">{{ i18n "experience_form_uni" }}</label>
    <input type="text" name="studienort" id="ef-uni">
    <p class="form-hint">{{ i18n "experience_form_uni_hint" }}</p>
  </div>
  <div>
    <label for="ef-prep">{{ i18n "experience_form_prep" }}</label>
    <textarea name="vorbereitung" id="ef-prep" required></textarea>
  </div>
  <div>
    <label for="ef-helped">{{ i18n "experience_form_helped" }}</label>
    <textarea name="was_geholfen" id="ef-helped" required></textarea>
  </div>
  <div>
    <label for="ef-tip">{{ i18n "experience_form_tip" }}</label>
    <textarea name="tipp" id="ef-tip" required></textarea>
  </div>
  <div class="form-consent">
    <label>
      <input type="checkbox" name="einverstaendnis" value="ja" required>
      <span>{{ i18n "experience_form_consent" }}</span>
    </label>
  </div>

  <div class="visually-hidden-field" aria-hidden="true">
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
  </div>

  {{- /* Von JS beim Absenden befüllt - siehe <script> unten. Kein Unterstrich am Namensanfang
     (ausser _subject), sonst behandelt Formspree das Feld als Steuerfeld statt als Formulardaten. */}}
  <input type="hidden" name="dateiname">
  <input type="hidden" name="dateiinhalt">
  <input type="hidden" name="_subject">

  <button type="submit" class="btn btn-primary">{{ i18n "experience_form_submit" }}</button>

  <div class="form-success" role="status" tabindex="-1" hidden>
    <strong>{{ i18n "experience_form_success_heading" }}</strong>
    <p>{{ i18n "experience_form_success_body" }}</p>
  </div>
  <div class="form-error" role="alert" tabindex="-1" hidden>
    <strong>{{ i18n "experience_form_error_heading" }}</strong>
    <p>{{ i18n "experience_form_error_body" }}</p>
  </div>
</form>

<script>
(function(){
  var sendingLabel = {{ i18n "experience_form_sending" }};

  var DIACRITIC_MARKS = new RegExp(String.fromCharCode(91) + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036f) + String.fromCharCode(93), 'g');

  function slugify(str){
    return String(str)
      .toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .normalize('NFD').replace(DIACRITIC_MARKS, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function yamlEscape(str){
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/"/g, '\\"')
      .replace(/\r\n/g, '\\n')
      .replace(/[\r\n]/g, '\\n');
  }

  function todayISO(){
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function buildDateiinhalt(name, jahr, ort, vorbereitung, geholfen, tipp){
    var lines = [];
    lines.push('---');
    lines.push('title: "Erfahrungsbericht von ' + yamlEscape(name) + '"');
    lines.push('name: "' + yamlEscape(name) + '"');
    lines.push('jahr: ' + jahr);
    if(ort && ort.trim()){
      lines.push('ort: "' + yamlEscape(ort) + '"');
    }
    lines.push('date: ' + todayISO());
    lines.push('draft: false');
    lines.push('---');
    lines.push('');
    lines.push('## Wie ich mich vorbereitet habe');
    lines.push('');
    lines.push(vorbereitung);
    lines.push('');
    lines.push('## Was mir am meisten geholfen hat');
    lines.push('');
    lines.push(geholfen);
    lines.push('');
    lines.push('## Mein Tipp');
    lines.push('');
    lines.push(tipp);
    return lines.join('\n');
  }

  document.querySelectorAll('.experience-form').forEach(function(form){
    var success = form.querySelector('.form-success');
    var error = form.querySelector('.form-error');
    var submitBtn = form.querySelector('button[type="submit"]');
    var submitLabel = submitBtn ? submitBtn.textContent : '';

    form.addEventListener('submit', function(evt){
      evt.preventDefault();
      if(!form.checkValidity()){
        form.reportValidity();
        return;
      }

      var name = form.elements['display_name'].value.trim();
      var jahr = form.elements['ems_jahr'].value;
      var ort = form.elements['studienort'].value.trim();
      var vorbereitung = form.elements['vorbereitung'].value.trim();
      var geholfen = form.elements['was_geholfen'].value.trim();
      var tipp = form.elements['tipp'].value.trim();

      form.elements['dateiname'].value = jahr + '-' + slugify(name) + '.md';
      form.elements['dateiinhalt'].value = buildDateiinhalt(name, jahr, ort, vorbereitung, geholfen, tipp);
      form.elements['_subject'].value = 'Neuer Erfahrungsbericht: ' + name + ' (' + jahr + ')';

      error.hidden = true;
      if(submitBtn){
        submitBtn.disabled = true;
        submitBtn.textContent = sendingLabel;
      }
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function(response){
        if(!response.ok){ throw new Error('request failed'); }
        form.querySelectorAll('input, textarea, select, button').forEach(function(el){ el.disabled = true; });
        success.hidden = false;
        success.focus();
      }).catch(function(){
        error.hidden = false;
        error.focus();
        if(submitBtn){
          submitBtn.disabled = false;
          submitBtn.textContent = submitLabel;
        }
      });
    });
  });
})();
</script>
