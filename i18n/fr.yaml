# Konztest auswerten (Alpha-Seite, layouts/partials/bausteine/konztest-auswertung.html)
kt_konztest: "Test de concentration"
kt_gruppe_testsim: "Simulations de test"
kt_gruppe_serien: "Séries d’exercices « Travail concentré »"
kt_serie: "{jahr}, série {nr}"
kt_eigen: "Propre test de concentration (charger un PDF)"
kt_eigen_feld: "Test de concentration en PDF : énoncé et feuille de solutions"
kt_eigen_hinweis: "Par exemple issu de l’outil de mise en forme : la page avec les 40 lignes de signes et la feuille de solutions avec les cases remplies – dans un fichier ou dans deux (sélectionne les deux). La lecture se fait sur ton appareil ; le test reste enregistré pour la prochaine fois."
kt_eigen_liest: "Lecture du PDF … page {n} sur {m}"
kt_eigen_ok: "Test lu : {z} signes cibles, {k} signes différents ({quelle}). Photographie maintenant la feuille remplie."
kt_eigen_keine_aufgabe: "Aucune page avec 40 lignes de 40 signes n’a été trouvée. L’énoncé du test est-il inclus (en PDF, pas en photo) ?"
kt_eigen_keine_loesung: "L’énoncé est lu, mais aucune feuille de solutions n’a été trouvée (cases remplies sur les signes cibles). Sélectionne l’énoncé et la solution ensemble."
kt_eigen_fehlt: "Choisis d’abord le test de concentration en PDF (énoncé et feuille de solutions)."
kt_intro: "Photographie ton test de concentration rempli (ou charge un scan). Les marques sont lues et comptées selon la règle de la consigne."
kt_foto: "Photo ou scan du test de concentration"
kt_tipps: "Pour un bon résultat : feuille posée à plat, les 40 lignes entières dans l’image, lumière uniforme, photo prise bien d’en haut. Marque de préférence avec un stylo foncé ; le crayon ne fonctionne que sur une photo en couleur."
kt_regel: "Le comptage suit la consigne : signes correctement marqués moins signes marqués à tort moins signes cibles omis avant le dernier signe marqué. C’est la valeur brute ; les points correspondants figurent dans l’évaluation de chaque simulation."
kt_legende: "Sur l’image : vert = marqué juste, rouge = marqué à tort, bleu = omis, orange = à vérifier ; la barre violette montre le dernier signe marqué (tout ce qui précède compte comme traité). Touche un signe pour changer sa marque – les points sont recalculés aussitôt."
kt_kein_raster: "La grille des signes n’a pas été trouvée ({n} sur 1600 signes). Est-ce bien le test de concentration, entier et net dans l’image ?"
kt_passt_nicht: "La feuille ne correspond pas à ce test de concentration : les signes sont disposés autrement. Le bon test est-il choisi ?"
kt_zu_klein: "La feuille est trop petite sur l’image. Merci de photographier de plus près."
kt_unklar: "Les traits ne ressortent pas assez nettement sur cette image. Prends une nouvelle photo : plus près, nette, éclairée de manière égale, sans ombre ni reflet."
kt_grau: "L’image est en noir et blanc. Le crayon ou un stylo clair s’y distinguent mal des signes – merci de vérifier les marques ci-dessous."
kt_summe: "Valeur brute : {n} points"
kt_richtig: "Marqués juste"
kt_falsch: "Marqués à tort"
kt_ausgelassen: "Omis (avant le dernier signe marqué)"
kt_bis: "Travaillé jusqu’à la ligne {z}, signe {s}"
kt_nichts: "Aucune marque trouvée"
kt_unsicher: "{n} signes n’ont pas pu être lus avec certitude (entourés en orange). Regarde-les et touche-les si la marque n’est pas juste."
kt_kamera_raster: "{n} % de la grille dans l’image – cadre toute la feuille."
