pm_einleitung: "Esercitati a casa nelle condizioni della giornata del test: con istruzioni lette ad alta voce e un orologio come quello appeso nell'aula d'esame. Scegli tra la simulazione completa, singoli sottotest o un tuo svolgimento personalizzato."
pm_so_gehts: "**Come funziona:** prepara prima uno dei fascicoli di test qui sopra o una serie di esercizi e un foglio delle risposte. Poi premi «Avvia» – il cronometro passa a schermo intero, senti l'istruzione e poi è silenzio fino allo scadere del tempo. Nella simulazione completa si prosegue senza clic al sottotest successivo, come al vero AMS: in mezzo non ci sono pause."
