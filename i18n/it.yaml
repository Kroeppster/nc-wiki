fg_heft_einpraegen: "Memorizzazione di fatti (fase di apprendimento)"
fg_heft_abfrage: "Memorizzazione di fatti (fase di riproduzione)"
fg_anl_e1: "Il seguente test mette alla prova la vostra capacità di memorizzare e ricordare dei fatti."
fg_anl_e2: "Vi vengono presentati 15 pazienti. Di ciascuno vengono indicati il nome, l’età, la professione e il sesso, un’altra caratteristica descrittiva (ad es. lo stato di famiglia) e la diagnosi."
fg_anl_e3: "Un esempio di una simile descrizione:"
fg_anl_beispiel: "Meier: circa 40 anni, poliziotta, nubile - frattura dell'omero."
fg_anl_e4: "Il vostro compito è quello di memorizzare le informazioni relative a ogni persona in modo tale da poter rispondere, in un secondo tempo, alle domande su dettagli. Una di queste domande potrebbe ad es. essere la seguente:"
fg_anl_beispielfrage: "La persona con la frattura dell'omero è di professione..."
fg_anl_beispieloptionen: "Elettricista|Violinista|Poliziotta|Biologa|Venditrice"
fg_anl_beispielloesung: "La risposta corretta sarebbe (C)."
fg_anl_a1: "Precedentemente avete cercato di memorizzare le caratteristiche di alcune persone. A questo punto dovete rispondere alle domande che vi verranno poste su di esse. Per ogni esercizio fate un segno sulla risposta corretta sul foglio delle risposte."
fg_anl_a2: "(Attenzione alla disposizione degli esercizi <b>per colonne</b>!)"
fig_heft_einpraegen: "Memorizzazione di figure (fase di apprendimento)"
fig_heft_abfrage: "Memorizzazione di figure (fase di riproduzione)"
fig_anl_e1: "Questo test verifica la vostra abilità di percepire, memorizzare e riconoscere visivamente particolari di oggetti."
fig_anl_e2: "Vi saranno mostrate 18 figure, ciascuna delle quali ha una parte annerita."
fig_anl_beispiel: "Esempio:"
fig_anl_e3: "Dovete riuscire a ricordarvi il punto in cui si trova l’area annerita, così da poter dire in seguito dove essa si trovava nella figura. Le figure vi verranno mostrate poi però in un ordine diverso."
fig_anl_beispiel_abfrage: "Un esempio del modo in cui, più tardi, vi verrà presentata la domanda:"
fig_anl_beispiel_loesung: "La soluzione sarebbe ({x})."
fig_anl_a1: "A questo punto dovete indicare quale parte di ogni figura che avete memorizzato durante la fase di apprendimento è annerita. Per ogni figura segnate la soluzione corretta sul foglio delle risposte.\n(Attenzione alla disposizione delle figure per righe!)"

