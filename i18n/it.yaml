# Konztest auswerten (Alpha-Seite, layouts/partials/bausteine/konztest-auswertung.html)
kt_konztest: "Test di concentrazione"
kt_gruppe_testsim: "Simulazioni del test"
kt_gruppe_serien: "Serie di esercizi «Lavoro concentrato»"
kt_serie: "{jahr}, serie {nr}"
kt_eigen: "Test di concentrazione proprio (caricare un PDF)"
kt_eigen_feld: "Test di concentrazione in PDF: compito e foglio delle soluzioni"
kt_eigen_hinweis: "Per esempio dallo strumento di formattazione: la pagina con le 40 righe di simboli e il foglio delle soluzioni con le caselle riempite – in un file o in due (selezionali entrambi). La lettura avviene sul tuo dispositivo; il test resta salvato per la prossima volta."
kt_eigen_liest: "Lettura del PDF … pagina {n} di {m}"
kt_eigen_ok: "Test letto: {z} simboli bersaglio, {k} simboli diversi ({quelle}). Ora fotografa il foglio svolto."
kt_eigen_keine_aufgabe: "Non è stata trovata nessuna pagina con 40 righe di 40 simboli stampati a colori. Il compito del test è incluso – in PDF, con i simboli a colori (magenta), non in nero? Un foglio delle soluzioni da solo non basta. I test di concentrazione delle nostre simulazioni e serie di esercizi si scelgono direttamente qui sopra, senza caricare nulla."
kt_eigen_keine_loesung: "Il compito è stato letto, ma non è stato trovato nessun foglio delle soluzioni (caselle riempite sui simboli bersaglio). Seleziona compito e soluzione insieme."
kt_eigen_fehlt: "Scegli prima il test di concentrazione in PDF (compito e foglio delle soluzioni)."
kt_intro: "Fotografa il tuo test di concentrazione svolto (o carica una scansione). I segni vengono letti e contati secondo la regola delle istruzioni."
kt_foto: "Foto o scansione del test di concentrazione"
kt_tipps: "Per un buon risultato: segna come richiesto in alto sul foglio – con un fineliner spesso nero o blu, un tratto obliquo attraverso il simbolo. Foglio steso in piano, tutte le 40 righe intere e libere nell’immagine (nessun dito sopra), luce il più uniforme possibile senza riflessi; un angolo leggermente obliquo va bene."
kt_regel: "Il conteggio segue le istruzioni: simboli segnati correttamente meno simboli segnati per errore meno simboli bersaglio omessi prima dell’ultimo simbolo segnato. È il valore grezzo; i punti corrispondenti sono nella valutazione di ogni simulazione."
kt_legende: "Nell’immagine: verde = segnato giusto, rosso = segnato per errore, blu = omesso, arancione = da controllare; la barra viola indica l’ultimo simbolo segnato (tutto ciò che precede conta come svolto). Tocca un simbolo per cambiarne il segno: i punti si ricalcolano subito."
kt_kein_raster: "La griglia dei simboli non è stata trovata ({n} su 1600 simboli). È il test di concentrazione, intero, nitido e senza riflessi nell’immagine?"
kt_passt_nicht: "Il foglio non corrisponde a questo test di concentrazione: i simboli sono disposti diversamente. Hai scelto il test giusto?"
kt_zu_klein: "Il foglio è troppo piccolo nell’immagine. Fotografa più da vicino."
kt_unklar: "I tratti non si distinguono abbastanza chiaramente in questa immagine. Scatta una nuova foto: più da vicino, nitida, illuminata in modo uniforme, senza ombre né riflessi. Hai segnato in modo molto sottile o chiaro, oppure hai solo sottolineato? È quasi illeggibile – ripassa allora i tratti con un fineliner spesso, in obliquo attraverso i simboli."
kt_verdeckt: "Una parte del foglio è coperta o fuori dall’immagine (dito, oggetto, riflesso, bordo). Fotografa tutto il foglio, libero e senza riflessi."
kt_unplausibel: "Attenzione: fino all’ultimo simbolo segnato mancano molti simboli bersaglio ({n} su {m}). Controlla l’immagine – forse tratti sottili o chiari non sono stati riconosciuti. Con una penna scura, un tratto marcato e una nuova foto di solito funziona."
kt_grau: "L’immagine è in bianco e nero: i segni non si distinguono in modo affidabile dai simboli. Fotografa o scansiona a colori – il test di concentrazione è stampato a colori."
kt_summe: "Valore grezzo: {n} punti"
kt_richtig: "Segnati giusti"
kt_falsch: "Segnati per errore"
kt_ausgelassen: "Omessi (prima dell’ultimo simbolo segnato)"
kt_bis: "Svolto fino alla riga {z}, simbolo {s}"
kt_nichts: "Nessun segno trovato"
kt_unsicher: "{n} simboli non erano leggibili con certezza (cerchiati in arancione). Guardali e toccali se il segno non è giusto."
kt_kamera_raster: "{n} % della griglia nell’immagine – inquadra tutto il foglio."
kt_kamera_luecken: "Il foglio è interamente nell’immagine, ma solo il {n} % dei simboli è riconoscibile: riflessi, ombre o immagine sfocata? Illumina in modo uniforme, senza riflessi, e tieni fermo il telefono."
lg_intro: "Esercitati in «Memorizzazione di figure», «Memorizzazione di fatti» o in entrambi come il giorno del test: prima memorizzare, poi una distrazione, poi la riproduzione. Ogni volta viene estratto un nuovo gruppo – altrimenti il materiale di questi sottotest è esaurito dopo averlo imparato una volta."
lg_waehlen: "Che cosa vuoi esercitare?"
lg_figuren: "Memorizzazione di figure"
lg_fakten: "Memorizzazione di fatti"
lg_keine_auswahl: "Scegli almeno un sottotest."
lg_gesamt: "In totale {n} su {von} corretti"
lg_drucken_hinweis: "Per esercitarsi su carta: la stampa è strutturata come un fascicolo dello strumento di formattazione – fase di apprendimento (parte A), fase di riproduzione (parte B), foglio delle risposte e soluzioni. Nella finestra di stampa si può anche scegliere «Salva come PDF»."

