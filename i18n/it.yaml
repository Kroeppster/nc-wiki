# Antwortbogen auswerten (Alpha-Seite, layouts/partials/bausteine/antwortbogen-auswertung.html)
ab_intro: "Fotografa il tuo foglio delle risposte compilato di una simulazione o carica una scansione (immagine o PDF). I segni vengono letti e confrontati con le soluzioni: ottieni i tuoi punti per ogni sottotest."
ab_privat: "La foto non lascia il tuo dispositivo: la lettura e la valutazione avvengono direttamente nel browser, nulla viene caricato o salvato."
ab_testsim: "Simulazione del test"
ab_testsim_jahr: "Simulazione del test {jahr}"
ab_foto: "Foto o scansione del foglio delle risposte"
ab_tipps: "Per un buon risultato: segna come richiesto in alto sul foglio – a matita, un tratto obliquo nella casella, marcato e non troppo sottile; foglio steso in piano, tutti e quattro gli angoli neri nell’immagine, luce uniforme senza ombre forti, foto il più possibile dall’alto. Va bene anche una scansione, come immagine o PDF."
ab_liest: "Lettura del foglio …"
ab_fehler_bild: "Impossibile aprire l’immagine. Scegli una foto o una scansione in JPG, PNG o PDF."
ab_fehler_klein: "Il foglio è troppo piccolo nell’immagine (circa {n} pixel di larghezza, ne servono almeno 700). Fotografa più da vicino."
ab_fehler_kein: "Nell’immagine non è stato riconosciuto nessun foglio delle risposte, oppure la foto è troppo chiara o tagliata. Si vedono tutti e quattro gli angoli neri?"
ab_fehler_flach: "I quattro angoli neri sono stati trovati, ma le caselle non si riconoscono ovunque: riflessi o un’ombra marcata, oppure il foglio è curvo o piegato? Stendilo bene in piano e fotografalo di nuovo dall’alto, con luce uniforme e senza riflessi."
ab_hinweis_drei: "Sono stati trovati solo tre dei quattro angoli neri. Controlla le risposte lette qui sotto."
ab_hinweis_keine: "Gli angoli neri non sono stati trovati, il foglio è stato allineato al bordo dell’immagine. Controlla attentamente le risposte lette qui sotto."
ab_hinweis_verzerrt: "La foto è distorta ({n} % di differenza tra larghezza e altezza). Controlla le risposte lette qui sotto."
ab_hinweis_zeilen: "Non tutte le righe del foglio sono state riconosciute. Controlla le risposte lette qui sotto."
ab_hinweis_blass: "I tratti sono molto chiari nell’immagine – alcuni potrebbero mancare. Per questo le righe vuote sono segnate in arancione: confrontale con il foglio. La prossima volta segna con più forza con una matita morbida (HB o B) o fotografa con più luce."
ab_hinweis_rauschen: "L’immagine è molto disturbata o sfocata (poca luce o mossa) – per questo molte righe sono da controllare. Una nuova foto con più luce, tenendo il telefono fermo, sarà più precisa."
ab_ergebnis: "{n} punti su {von}"
