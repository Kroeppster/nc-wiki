# Konztest auswerten (Alpha-Seite, layouts/partials/bausteine/konztest-auswertung.html)
kt_konztest: "Konztest"
kt_gruppe_testsim: "Testsimulationen"
kt_gruppe_serien: "Übungsserien «Konzentriertes Arbeiten»"
kt_serie: "{jahr}, Serie {nr}"
kt_eigen: "Eigener Konztest (PDF hochladen)"
kt_eigen_feld: "Konztest als PDF: Aufgabe und Lösungsblatt"
kt_eigen_hinweis: "Zum Beispiel aus dem Formatierungstool: die Seite mit den 40 Zeilen Zeichen und das Lösungsblatt mit den ausgefüllten Kästchen – in einer Datei oder in zwei (beide auswählen). Gelesen wird auf deinem Gerät; der Konztest bleibt für das nächste Mal gespeichert."
kt_eigen_liest: "PDF wird gelesen … Seite {n} von {m}"
kt_eigen_ok: "Konztest gelesen: {z} Zielzeichen, {k} verschiedene Zeichen ({quelle}). Jetzt den bearbeiteten Bogen fotografieren."
kt_eigen_keine_aufgabe: "Darin wurde keine Seite mit 40 Zeilen zu 40 Zeichen gefunden. Ist die Aufgabe des Konztests dabei (als PDF, nicht als Foto)?"
kt_eigen_keine_loesung: "Die Aufgabe ist gelesen, aber kein Lösungsblatt gefunden (ausgefüllte Kästchen auf den Zielzeichen). Wähle Aufgabe und Lösung zusammen aus."
kt_eigen_fehlt: "Wähle zuerst den Konztest als PDF (Aufgabe und Lösungsblatt)."
kt_intro: "Fotografiere deinen bearbeiteten Konzentrationstest (oder lade einen Scan hoch). Die Markierungen werden gelesen und nach der Regel der Anleitung gezählt."
kt_foto: "Foto oder Scan des Konzentrationstests"
kt_tipps: "So klappt es am besten: Blatt flach hinlegen, alle 40 Zeilen ganz im Bild, gleichmässiges Licht, möglichst gerade von oben. Am besten mit dunklem Stift markieren; Bleistift geht nur auf einem Farbfoto."
kt_regel: "Gezählt wird wie in der Anleitung: richtig markierte Zeichen minus falsch markierte minus ausgelassene Zielzeichen vor dem letzten markierten Zeichen. Das ist der Rohwert; wie viele Punkte er im Vergleich ergibt, steht in der Auswertung der jeweiligen Testsimulation."
kt_legende: "Auf dem Bild: grün richtig markiert, rot falsch markiert, blau ausgelassen, orange bitte prüfen, der violette Balken zeigt das letzte markierte Zeichen (alles davor zählt als bearbeitet). Tippe auf ein Zeichen, um seine Markierung zu ändern – die Punkte rechnen sich sofort neu."
kt_kein_raster: "Das Raster der Zeichen wurde nicht gefunden ({n} von 1600 Zeichen). Ist das der Konzentrationstest, ganz und scharf im Bild?"
kt_passt_nicht: "Das Blatt passt nicht zu diesem Konztest: Die Zeichen stehen anders. Ist der richtige Konztest gewählt?"
kt_zu_klein: "Das Blatt ist auf dem Bild zu klein. Bitte näher heran fotografieren."
kt_unklar: "Die Striche heben sich auf diesem Bild nicht klar genug ab. Mach ein neues Foto: näher heran, scharf, gleichmässig hell, ohne Schatten und Spiegelung."
kt_grau: "Das Bild ist schwarz-weiss. Bleistift oder heller Stift lassen sich darin kaum von den Zeichen unterscheiden – bitte die Markierungen unten prüfen."
kt_summe: "Rohwert: {n} Punkte"
kt_richtig: "Richtig markiert"
kt_falsch: "Falsch markiert"
kt_ausgelassen: "Ausgelassen (vor dem letzten markierten Zeichen)"
kt_bis: "Bearbeitet bis Zeile {z}, Zeichen {s}"
kt_nichts: "Keine Markierung gefunden"
kt_unsicher: "{n} Zeichen waren nicht eindeutig zu lesen (orange umrandet). Schau sie dir an und tippe darauf, falls die Markierung nicht stimmt."
kt_kamera_raster: "{n} % des Rasters im Bild – das ganze Blatt ins Bild nehmen."
