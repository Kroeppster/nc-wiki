# ==============================================================================
# WORTLISTE DES FAKTEN-GENERATORS HOCHLADEN -> PULL REQUEST
# ==============================================================================
# Wer die Wörter des Fakten-Generators in Excel bearbeitet hat
# (ncwiki-wortliste-fakten-generator.xlsx, siehe redaktion/README.md), lädt die
# Datei auf GitHub in den Ordner "redaktion/" hoch (Add file -> Upload files).
# Diese Automatisierung macht daraus einen Pull Request zum Gegenlesen:
#
#   1. die Datei mit scripts/wortliste.py prüfen (Mindestmengen, doppelte
#      Wörter, Geschlecht m/w ...) und in data/fakten-generator/de.yaml
#      schreiben,
#   2. die hochgeladene Datei wieder entfernen,
#   3. die Website probeweise bauen,
#   4. alles als Pull Request mit einem Bericht: was neu ist, was wegfällt,
#      was zu beachten ist.
#
# Gibt es einen FEHLER in der Datei, wird nichts übernommen und KEIN Pull
# Request eröffnet: Der Lauf schlägt dann fehl, und seine Zusammenfassung
# nennt jeden Fehler mit Blatt und Zeile. Die Datei bleibt im Ordner
# "redaktion/"; korrigiert wieder hochladen (ersetzt sie).
#
# Live geht erst etwas, wenn jemand den Pull Request übernimmt (mergt).
#
# DIE TEXTMAPPEN (ncwiki-texte-*.xlsx) macht texte-einlesen.yml; dort ist die
# Wortliste bewusst ausgenommen, und umgekehrt reagiert dieser Ablauf nur auf
# Dateien, die mit "ncwiki-wortliste" beginnen.
#
# WICHTIG, EINMALIG EINZUSTELLEN (wie bei texte-einlesen.yml): Settings ->
# Actions -> General -> Workflow permissions -> "Allow GitHub Actions to
# create and approve pull requests". Ein von einer Automatisierung
# eröffneter Pull Request löst keine weiteren Automatisierungen aus - darum
# baut dieser Ablauf die Website selbst einmal probeweise.
# ==============================================================================

name: Wortliste einlesen

on:
  push:
    paths:
      - "redaktion/ncwiki-wortliste*.xlsx"
      - "redaktion/**/ncwiki-wortliste*.xlsx"

permissions:
  contents: write
  pull-requests: write

# Zwei Uploads kurz nacheinander: nacheinander abarbeiten, nicht abbrechen.
concurrency:
  group: wortliste-einlesen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  einlesen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nur die Dateien, die mit DIESEM Upload kamen.
      - name: Hochgeladene Datei finden
        id: dateien
        run: |
          jq -r '.commits[] | (.added + .modified)[]' "$GITHUB_EVENT_PATH" \
            | grep -E '^redaktion/(.*/)?ncwiki-wortliste[^/]*\.xlsx$' | sort -u > "$RUNNER_TEMP/gemeldet.txt" || true
          # Beim Anlegen eines neuen Branchs kann die Liste leer sein - dann alle im Ordner.
          [ -s "$RUNNER_TEMP/gemeldet.txt" ] || git ls-files 'redaktion/ncwiki-wortliste*.xlsx' > "$RUNNER_TEMP/gemeldet.txt"
          : > "$RUNNER_TEMP/dateien.txt"
          while IFS= read -r f; do
            [ -f "$f" ] && echo "$f" >> "$RUNNER_TEMP/dateien.txt"
          done < "$RUNNER_TEMP/gemeldet.txt"
          echo "anzahl=$(wc -l < "$RUNNER_TEMP/dateien.txt")" >> "$GITHUB_OUTPUT"
          echo "Dateien:"; cat "$RUNNER_TEMP/dateien.txt"

      - name: Python einrichten
        if: steps.dateien.outputs.anzahl != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Prüft und schreibt. Bei einem Fehler wird NICHTS geschrieben; der Bericht
      # kommt in die Zusammenfassung des Laufs, und ein späterer Schritt lässt
      # den Lauf rot enden.
      - name: Wortliste prüfen und einlesen
        id: lesen
        if: steps.dateien.outputs.anzahl != '0'
        run: |
          pip install --quiet openpyxl pyyaml
          mapfile -t DATEIEN < "$RUNNER_TEMP/dateien.txt"
          : > "$RUNNER_TEMP/bericht.md"
          STATUS=0
          for f in "${DATEIEN[@]}"; do
            python3 scripts/wortliste.py einlesen "$f" --bericht "$RUNNER_TEMP/eins.md" || STATUS=1
            cat "$RUNNER_TEMP/eins.md" >> "$RUNNER_TEMP/bericht.md"; echo >> "$RUNNER_TEMP/bericht.md"
            [ "$STATUS" = 0 ] || break
          done
          cat "$RUNNER_TEMP/bericht.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = 0 ]; then
            git rm -q -- "${DATEIEN[@]}"
            NAMEN=$(for m in "${DATEIEN[@]}"; do basename "$m"; done | paste -sd ',' | sed 's/,/, /g')
            echo "NAMEN=$NAMEN" >> "$GITHUB_ENV"
          fi

      - name: Hugo installieren
        if: steps.lesen.outputs.status == '0'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      # Bewusst ohne --quiet: das würde auch die Fehlermeldung verschlucken.
      - name: Website probeweise bauen
        if: steps.lesen.outputs.status == '0'
        run: |
          if hugo --minify -d "$RUNNER_TEMP/public" > "$RUNNER_TEMP/hugo.txt" 2>&1; then
            BAU="✅ Die Website baut mit dieser Wortliste fehlerfrei."
          else
            BAU=$(printf '%s\n\n```\n%s\n```' \
              "❌ **Die Website baut mit diesen Änderungen NICHT** – bitte vor dem Übernehmen beheben:" \
              "$(grep -E 'ERROR|Error' "$RUNNER_TEMP/hugo.txt" | tail -15)")
          fi
          {
            echo "Eingelesen aus: **$NAMEN** (hochgeladen von @${{ github.actor }})."
            echo
            echo "$BAU"
            echo
            cat "$RUNNER_TEMP/bericht.md"
            echo
            echo "---"
            echo "Bitte unter **Files changed** durchsehen (rot = fällt weg) und den Pull Request dann übernehmen (Merge). Zu sehen ist die neue Wortliste danach auf der Alpha-Seite. Anleitung: redaktion/README.md."
          } > "$RUNNER_TEMP/pr.md"

      # Hochgeladen direkt in main: neuer Branch + Pull Request.
      - name: Pull Request eröffnen
        if: steps.lesen.outputs.status == '0' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: redaktion/wortliste-${{ github.run_number }}
          commit-message: "Wortliste Fakten-Generator aus ${{ env.NAMEN }} einlesen"
          title: "Wortliste Fakten-Generator aus ${{ env.NAMEN }}"
          body-path: ${{ runner.temp }}/pr.md
          delete-branch: true

      # Hochgeladen in einen eigenen Branch (Option "Create a new branch"): die
      # Änderungen kommen in DIESEN Branch, und es gibt einen Pull Request dafür.
      - name: In den Branch schreiben
        if: steps.lesen.outputs.status == '0' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fakten-generator redaktion
          git commit -q -m "Wortliste Fakten-Generator aus $NAMEN einlesen"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          NR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')
          if [ -n "$NR" ]; then
            gh pr comment "$NR" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --base main --head "$GITHUB_REF_NAME" --title "Wortliste Fakten-Generator aus $NAMEN" \
              --body-file "$RUNNER_TEMP/pr.md"
          fi

      # Fehler in der Datei: Lauf rot, damit es nicht übersehen wird. Was zu
      # korrigieren ist, steht in der Zusammenfassung dieses Laufs.
      - name: Datei wurde nicht übernommen
        if: steps.lesen.outputs.status == '1'
        run: |
          echo "::error title=Wortliste nicht übernommen::In der Excel-Datei gibt es Fehler. Es wurde nichts verändert. Jeder Fehler steht mit Blatt und Zeile in der Zusammenfassung dieses Laufs. Korrigieren und die Datei noch einmal hochladen."
          exit 1

      - name: Hinweis, falls der Pull Request nicht eröffnet werden durfte
        if: failure() && steps.lesen.outputs.status == '0'
        run: |
          {
            echo "### Der Pull Request konnte nicht eröffnet werden"
            echo "Meist ist in den Einstellungen nicht erlaubt, dass Automatisierungen Pull Requests eröffnen:"
            echo "Settings → Actions → General → Workflow permissions → *Allow GitHub Actions to create and approve pull requests*."
            echo "Die Änderungen liegen im Branch \`redaktion/wortliste-${{ github.run_number }}\` (falls schon angelegt) –"
            echo "Pull Request von Hand: ${{ github.server_url }}/${{ github.repository }}/compare/main...redaktion/wortliste-${{ github.run_number }}"
          } >> "$GITHUB_STEP_SUMMARY"
