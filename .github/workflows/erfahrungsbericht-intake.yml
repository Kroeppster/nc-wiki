name: Erfahrungsbericht-Einreichung verarbeiten

on:
  repository_dispatch:
    types: [erfahrungsbericht-submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bericht-Markdown aus Formulardaten erzeugen
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const p = context.payload.client_payload || {};

            function req(field) {
              const v = (p[field] ?? '').toString().trim();
              if (!v) throw new Error(`Pflichtfeld fehlt oder leer: ${field}`);
              return v;
            }

            const name = req('display_name');
            const jahr = parseInt(req('ems_jahr'), 10);
            if (!Number.isInteger(jahr)) {
              throw new Error(`Ungültiges EMS-Jahr: ${p.ems_jahr}`);
            }

            const ort = (p.studienort ?? '').toString().trim();
            const vorbereitung = (p.vorbereitung ?? '').toString().trim();
            const geholfen = (p.was_geholfen ?? '').toString().trim();
            const tipp = (p.tipp ?? '').toString().trim();

            // E-Mail bewusst NICHT übernehmen: Sie ist laut Formular
            // "nur für Rückfragen, wird nicht veröffentlicht" - landet also
            // weder im Markdown noch im PR (der PR ist im Repo öffentlich sichtbar).

            function slugify(s) {
              return s
                .toLowerCase()
                .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '') || 'anonym';
            }

            const stamp = Date.now().toString(36);
            const slug = `bericht-${slugify(name)}-${stamp}`;
            const filePath = `content/de/ems/erfahrungsberichte/${slug}.md`;

            // JSON.stringify erzeugt gültige YAML-Skalare (YAML ist ein Superset von JSON)
            // und übernimmt dabei automatisch das Escaping von Anführungszeichen etc.
            const y = (v) => JSON.stringify(v);

            let fm = '---\n';
            fm += `name: ${y(name)}\n`;
            fm += `jahr: ${jahr}\n`;
            if (ort) fm += `ort: ${y(ort)}\n`;
            fm += `tags: []\n`;
            fm += `draft: true\n`;
            fm += '---\n\n';

            let body = '';
            if (vorbereitung) body += `## Wie hast du dich vorbereitet?\n\n${vorbereitung}\n\n`;
            if (geholfen) body += `## Was hat dir am meisten geholfen?\n\n${geholfen}\n\n`;
            if (tipp) body += `## Dein Tipp an zukünftige Teilnehmende?\n\n${tipp}\n`;

            fs.mkdirSync(path.dirname(filePath), { recursive: true });
            fs.writeFileSync(filePath, fm + body, 'utf8');

            core.setOutput('file_path', filePath);
            core.setOutput('name', name);
            core.setOutput('jahr', String(jahr));
            core.setOutput('slug', slug);

      - name: Pull Request öffnen
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Neuer Erfahrungsbericht: ${{ steps.build.outputs.name }} (EMS ${{ steps.build.outputs.jahr }})"
          title: "Erfahrungsbericht: ${{ steps.build.outputs.name }} (EMS ${{ steps.build.outputs.jahr }})"
          body: |
            Automatisch aus einer Formular-Einreichung (Formspree) erzeugt.

            - **Name:** ${{ steps.build.outputs.name }}
            - **EMS-Jahr:** ${{ steps.build.outputs.jahr }}

            Bitte vor dem Mergen prüfen (Inhalt, Ton, ggf. Tags in der Datei ergänzen)
            und `draft: true` entfernen bzw. auf `false` setzen, sobald der Bericht
            veröffentlicht werden soll. Die E-Mail-Adresse der einreichenden Person
            wurde absichtlich nicht übernommen und steht nur in Formspree.
          branch: "erfahrungsbericht/${{ steps.build.outputs.slug }}"
          add-paths: "content/de/ems/erfahrungsberichte/*.md"
          labels: |
            erfahrungsbericht
            needs-review
