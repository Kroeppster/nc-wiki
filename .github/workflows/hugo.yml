name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Hugo (Extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search index with Pagefind
        run: npx pagefind --site public

      - name: Prepare link-check root
        id: linkcheck
        run: |
          base_path=$(echo "${{ steps.pages.outputs.base_url }}" | sed -E 's#^https?://[^/]+##; s#/$##')
          target="linkcheck-root${base_path}"
          mkdir -p "$(dirname "$target")"
          ln -s "$(pwd)/public" "$target"
          echo "root=$(pwd)/linkcheck-root" >> "$GITHUB_OUTPUT"

      - name: Check internal links (fails build if broken)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ steps.linkcheck.outputs.root }}"
            "./public/**/*.html"
          fail: true

      - name: Check external links (warn only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir "${{ steps.linkcheck.outputs.root }}"
            "./public/**/*.html"
          fail: false
          jobSummary: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
