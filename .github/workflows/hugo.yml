# ==============================================================================
# AUTOMATISCHER BAU + VERÖFFENTLICHUNG DER WEBSITE
# ==============================================================================
# Das ist die "Automatisierung", die im Hintergrund läuft, sobald jemand
# etwas an der Website ändert und es in den "main"-Branch übernimmt (mergt).
# Sie macht - ohne dass jemand etwas von Hand tun muss - genau das, was man
# sonst am eigenen Computer eintippen müsste: die Website mit Hugo bauen,
# die Suchfunktion vorbereiten, prüfen ob alle internen Links funktionieren,
# und das Ergebnis live auf GitHub Pages veröffentlichen.
#
# WICHTIG zu wissen (siehe auch docs/WARTUNG.md, Abschnitt 7 "Was tun, wenn
# der Build rot wird?"): Der Bau- und Link-Prüf-Teil läuft seit 2026-08-15
# auch direkt auf jedem Pull Request gegen "main" - man sieht die rote/grüne
# Markierung (inkl. kaputter interner Links) also schon VOR dem Mergen,
# direkt im Pull Request. Veröffentlicht (auf GitHub Pages deployt) wird
# trotzdem ausschliesslich bei einem echten Push auf "main", NIE bei einem
# Pull Request (siehe die "if"-Bedingung beim "deploy"-Job weiter unten) -
# ein Pull Request kann also nie versehentlich etwas live schalten. Und:
# schlägt dieser Ablauf bei einem Push auf main fehl, heisst das NICHT, dass
# die Website offline ist - die zuletzt erfolgreich gebaute Version bleibt
# online, bis der Fehler behoben ist.
# ==============================================================================

name: Deploy Hugo site to GitHub Pages

# Läuft automatisch bei jeder Änderung auf dem "main"-Branch, bei jedem Pull
# Request gegen "main" (nur zur Vorab-Prüfung, siehe "deploy"-Job unten für
# die Einschränkung aufs eigentliche Veröffentlichen), oder kann von Hand
# über den "Actions"-Tab auf GitHub gestartet werden (workflow_dispatch).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Erlaubt dieser Automatisierung, den Inhalt des Repos zu lesen und die
# fertige Website auf GitHub Pages zu veröffentlichen.
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass zwei Veröffentlichungen gleichzeitig laufen und sich
# gegenseitig ins Gehege kommen - läuft bereits eine, wartet die nächste,
# statt eine bereits laufende abzubrechen (cancel-in-progress: false). Für
# Pull Requests gilt das NICHT: dort bekommt jeder PR seine eigene Gruppe
# (anhand der PR-Nummer) und ein neuer Push auf denselben PR-Branch bricht
# den vorherigen, überholten Prüf-Lauf ab (cancel-in-progress: true) - so
# wartet man nicht unnötig auf einen veralteten Lauf, und PR-Prüfungen
# blockieren nie die "push"-Gruppe (und damit ein echtes Deployment).
concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'push' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # SCHRITT 1: Die Website bauen und auf Fehler prüfen
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    # Absicherung: ohne diese Zeile darf ein einzelner Lauf bis zu 6 Stunden
    # dauern, bevor GitHub ihn von selbst abbricht - das ist viel zu lange,
    # falls (wie am 2026-08-08 passiert) ein einzelner Schritt aus
    # irgendeinem Grund hängen bleibt (siehe Hinweis beim externen
    # Link-Check weiter unten). Bricht der ganze Ablauf hier nach 15 Minuten
    # ab, blockiert das wegen der "concurrency"-Einstellung oben auch nicht
    # mehr stundenlang alle nachfolgenden Veröffentlichungen.
    timeout-minutes: 15
    steps:
      # Holt den aktuellen Stand des Repos auf den (virtuellen) Rechner, auf
      # dem diese Automatisierung läuft.
      - name: Checkout
        uses: actions/checkout@v4

      # Bereitet GitHub Pages vor und liefert u.a. die endgültige Webadresse
      # der Seite (wird gleich beim Hugo-Bauen gebraucht).
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Installiert Hugo selbst (das Programm, das aus den Textdateien die
      # fertige Website baut) auf diesem virtuellen Rechner. Feste Version
      # statt "latest": so baut die Seite immer mit genau der Hugo-Version,
      # die auch lokal getestet wurde - "latest" könnte sich unbemerkt
      # ändern und beim nächsten Bauen ohne Vorwarnung etwas kaputt machen.
      # Ermittelt über das <meta name="generator">-Tag der zuletzt live
      # deployten Seite (zuverlässiger als die lokal installierte Version).
      # Beim Erhöhen: Version hier UND lokal aktualisieren, dann neu testen.
      - name: Install Hugo (Extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      # Installiert Node.js, wird für die Suchfunktion (Pagefind, ein
      # npm-Paket) gebraucht.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Der eigentliche Bau-Schritt: baut aus allen Textdateien die fertige
      # Website (landet im Ordner "public/"). "--baseURL" sorgt dafür, dass
      # alle Links auf der Website auf die ECHTE, endgültige Webadresse
      # zeigen (nicht auf localhost wie in hugo.toml lokal eingestellt).
      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Baut den durchsuchbaren Suchindex für die Suchfunktion oben rechts
      # auf der Website (Pagefind durchsucht dafür den fertigen "public/"-
      # Ordner von eben und legt seinen Index dort mit ab).
      - name: Build search index with Pagefind
        run: npx pagefind --site public

      # Technischer Zwischenschritt für die Link-Prüfung gleich danach: die
      # fertigen Seiten enthalten absolute Links wie "/nc-wiki/fr/news/"
      # (inklusive des GitHub-Pages-Unterpfads "/nc-wiki/") - damit das
      # Prüf-Werkzeug (lychee) diese Links trotzdem auf der Festplatte
      # wiederfindet, wird hier ein Verweis ("symbolischer Link") namens
      # z.B. "linkcheck-root/nc-wiki" angelegt, der auf den echten
      # "public/"-Ordner zeigt. Falls die Website später auf eine eigene
      # Domain ohne Unterpfad umzieht, passt sich das automatisch an - der
      # Pfad wird dann einfach aus der jeweils aktuellen Webadresse abgeleitet.
      - name: Prepare link-check root
        id: linkcheck
        run: |
          base_path=$(echo "${{ steps.pages.outputs.base_url }}" | sed -E 's#^https?://[^/]+##; s#/$##')
          target="linkcheck-root${base_path}"
          mkdir -p "$(dirname "$target")"
          ln -s "$(pwd)/public" "$target"
          echo "root=$(pwd)/linkcheck-root" >> "$GITHUB_OUTPUT"

      # Prüft ALLE internen Links (Verweise auf andere Seiten INNERHALB
      # dieser Website) - zeigt einer davon ins Leere (z.B. Tippfehler,
      # gelöschte Seite), schlägt dieser Schritt fehl und die ganze
      # Veröffentlichung wird gestoppt (fail: true), damit keine kaputte
      # Version live geht. "--offline" heisst: es werden dabei bewusst KEINE
      # externen Websites angefragt (dafür ist der nächste Schritt da).
      - name: Check internal links (fails build if broken)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ steps.linkcheck.outputs.root }}"
            "./public/**/*.html"
          fail: true

      # Prüft ZUSÄTZLICH auch Links zu ANDEREN Websites (z.B. zu
      # swissuniversities.ch) - aber rein informativ: ist so ein externer
      # Link kaputt (weil sich die andere Website geändert hat, was wir
      # nicht beeinflussen können), wird das nur im Job-Summary auf GitHub
      # angezeigt, die Veröffentlichung läuft trotzdem normal weiter.
      #
      # WICHTIG (Lehre aus ZWEI echten Vorfällen am 2026-08-08): dieser
      # Schritt fragt echte, fremde Websites im Internet an - blockiert eine
      # davon Anfragen von GitHub (z.B. als Bot-Schutz) oder antwortet sehr
      # langsam, kann das lange dauern. "--timeout"/"--max-retries" begrenzen
      # das pro einzelner Adresse, "timeout-minutes" ist eine zusätzliche
      # Notbremse von GitHub selbst für den ganzen Schritt.
      #
      # Erster Vorfall: ganz ohne diese Bremsen hat ein einzelner Lauf über
      # 30 Minuten gehangen und wegen der "concurrency"-Einstellung oben
      # dadurch auch alle nachfolgenden Veröffentlichungen blockiert.
      #
      # Zweiter Vorfall, direkt durch den Fix des ersten verursacht: "fail:
      # false" lässt den Schritt zwar nicht fehlschlagen, WENN lychee kaputte
      # externe Links findet - aber wenn GitHub den Schritt selbst wegen
      # "timeout-minutes" abwürgt (weil das Prüfen aller externen Links
      # länger dauert, als die Zahl unten erlaubt), zählt das als eigener,
      # davon unabhängiger Fehlschlag, den "fail: false" NICHT abfängt. Das
      # hat prompt den nächsten Lauf komplett rot gemacht und das Deployment
      # übersprungen - genau das, was dieser ganze externe Check eigentlich
      # nie tun sollte. "continue-on-error: true" fängt das jetzt zusätzlich
      # ab: WAS AUCH IMMER in diesem Schritt passiert (kaputte Links,
      # Timeout, Absturz), der Rest des Ablaufs (Veröffentlichen!) läuft so
      # oder so weiter.
      - name: Check external links (warn only)
        uses: lycheeverse/lychee-action@v2
        timeout-minutes: 10
        continue-on-error: true
        with:
          args: >-
            --no-progress
            --timeout 10
            --max-retries 1
            --root-dir "${{ steps.linkcheck.outputs.root }}"
            "./public/**/*.html"
          fail: false
          jobSummary: true

      # Verpackt den fertigen "public/"-Ordner zur Übergabe an den
      # Veröffentlichungs-Schritt (den zweiten "job" unten). Nur bei einem
      # echten Push auf main nötig - bei einem Pull Request läuft der
      # "deploy"-Job ohnehin nicht (siehe dessen "if"-Bedingung), das
      # Artefakt würde also nie gebraucht.
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ---------------------------------------------------------------------------
  # SCHRITT 2: Veröffentlichen (läuft nur, wenn Schritt 1 komplett erfolgreich
  # war UND es sich um einen echten Push auf main handelt - bei einem Pull
  # Request wird nur geprüft/gebaut, nie veröffentlicht).
  # ---------------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
