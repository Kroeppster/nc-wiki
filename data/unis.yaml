  # Bitte auf den offiziellen Seiten nachschlagen und eintragen; solange ein
  # Feld null ist, erscheint es auf der Website gar nicht (statt mit einem
  # erfundenen Wert). Siehe Feldbeschreibung im Kopf dieser Datei.
  website_medizin: null
  anmeldefrist: null
  studienbeginn: null
  semestergebuehr: null
  # Verknuepfung zu den Erfahrungsberichten: der Wert, der in den Berichten im
  # Feld "ort" steht. Leer lassen, wenn es zu diesem Ort keine Berichte gibt.
