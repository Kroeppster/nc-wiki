# ============================================================================
# UNIGUIDE-DATEN (alle Schweizer Universitäten mit Medizinstudium)
# ============================================================================
# Wird für zwei Ansichten verwendet: die grosse Vergleichstabelle (siehe
# layouts/partials/uniguide-table.html) und die Detailseite jeder einzelnen
# Universität (siehe layouts/partials/uni-detail.html). Jede Universität
# braucht dafür ZWEI Dinge: einen Eintrag hier UND eine passende, fast leere
# Seite unter content/<sprache>/ems/uniguide/<slug>.md (nur "title" und
# "uni_slug" - Beispiel: content/de/ems/uniguide/basel.md) - ohne diese
# Seite würde der Link von der Tabelle zur Detailseite ins Leere führen.
#
# Recherchiert am 2026-08-07 anhand offizieller Quellen (swissuniversities.ch,
# jeweilige Universitäts-Website). Zahlen (studienplaetze) absichtlich NICHT
# recherchiert/eingetragen, siehe Projektvorgabe - bitte selbst auf den
# offiziellen Seiten prüfen und eintragen. Wo etwas unsicher/nicht
# bestätigt ist, steht statt eines erfundenen Werts "TODO: prüfen".
#
# Felder je Eintrag:
#   slug             - technischer Name für die Web-Adresse, z.B. "basel"
#   name             - offizieller Name der Universität (wird NICHT übersetzt,
#                       auch auf FR/IT-Seiten steht der echte, offizielle Name)
#   kanton           - Standort-Kanton
#   sprache          - Liste der Unterrichtssprache(n)
#   studiengaenge    - Liste, z.B. ["Bachelor", "Master"]
#   ems_erforderlich - "ja", "nein" oder "teilweise"
#   auswahlverfahren - Kurztext zum Zulassungsverfahren
#   studienplaetze   - Zahl oder null (siehe Hinweis oben)
#   besonderheiten   - Liste mit Stichpunkten zu Sonderfällen (optional, kann leer sein)
#   website          - offizielle Website der Universität
#   stand            - Datum, an dem diese Angaben zuletzt geprüft wurden
#   quelle           - Link zur Quelle dieser Angaben (Nachvollziehbarkeit)
#   website_medizin  - direkter Link zur medizinischen Fakultät (nicht zur
#                       allgemeinen Uni-Startseite) oder null
#   anmeldefrist     - Frist für die Anmeldung, als Text ("15. Februar") oder null
#   studienbeginn    - wann das Studium startet, als Text, oder null
#   semestergebuehr  - Semestergebühr als Text inkl. Währung ("CHF 850") oder null
#   berichte_ort     - technische Verknüpfung, KEINE Anzeige: der Wert, der in
#                       den Erfahrungsberichten im Feld "ort" steht (z.B.
#                       "Zürich"). Damit erscheinen auf der Uni-Seite automatisch
#                       die passenden Erfahrungsberichte. Leer lassen ("") wenn
#                       es zu diesem Ort keine Berichte gibt.
#
# WICHTIG - KEINE ERFUNDENEN ANGABEN: Ein Feld, das nicht sicher recherchiert
# ist, bleibt null. Es erscheint dann auf der Website gar nicht, und auf der
# Uni-Seite steht stattdessen ein Hinweis, dass die Angabe noch fehlt. Das ist
# deutlich besser als eine Zahl, auf die sich jemand bei der Studienwahl
# verlässt und die nicht stimmt.

