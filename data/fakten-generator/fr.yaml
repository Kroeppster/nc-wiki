nicht_attributiv: []

fragen:
  der:     { m: "Le", w: "La" }
  patient: { m: "patient", w: "patiente" }
  anrede:  { m: "Monsieur", w: "Madame" }
  # Artikel vor einem Beruf am Satzanfang: "Le pilote", "La vendeuse",
  # "L'avocate", auch vor stummem h ("L'horloger").
  artikel_beruf: { m: "Le", w: "La", vokal: "L'", h_stumm: true }
  # "souffrant de diabète", aber "souffrant d'asthme"
  praep_de: { normal: "de ", vokal: "d'" }
  # So steht eine Person in der Einprägeliste - wie im Beispiel der Anleitung:
  # "Meier : env. 40 ans, policière, célibataire - fracture de l'humérus".
  alter_liste: "env. {alter} ans"
  zeile: "{beruf}, {merkmal} - {diagnose}"
  alter_antwort: "env. {alter} ans"
  typen:
    alter_von_diagnose:   "La personne souffrant {de_diagnose} a …"
    beruf_von_diagnose:   "La personne souffrant {de_diagnose} exerce la profession de …"
    name_von_diagnose:    "{Der} {Patient} souffrant {de_diagnose} s'appelle …"
    merkmal_von_diagnose: "{Der} {Patient} souffrant {de_diagnose} est …"
    name_von_merkmal:     "{Der} {Patient} {merkmal_attr} s'appelle …"
    diagnose_von_merkmal: "{Der} {Patient} {merkmal_attr} souffre de …"
    name_von_beruf:       "{Der_beruf} s'appelle …"
    merkmal_von_beruf:    "{Der_beruf} est …"
    diagnose_von_beruf:   "{Der_beruf} souffre de …"
    beruf_von_name:       "{Anrede} {name} exerce la profession de …"
    diagnose_von_name:    "{Anrede} {name} souffre de …"
    beruf_von_alter:      "{Der} {Patient} de {alter} ans exerce la profession de …"
