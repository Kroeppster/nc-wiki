# ==============================================================================
# WORTLISTEN FÜR DEN FAKTEN-GENERATOR - FRANZÖSISCH
# ==============================================================================
# Gleicher Aufbau wie de.yaml (dort steht die ausführliche Erklärung, warum die
# Kategorien wichtig sind). Unterschiede zum Deutschen:
#  - "grammatik: fr": Merkmale haben eine Form je Geschlecht
#    ({ m: "nerveux", w: "nerveuse" }; unveränderliche wie "calme" bleiben ein
#    Wort) und stehen hinter dem Nomen ("Le patient nerveux").
#  - Vor einem Beruf steht der Artikel mit Apostroph, wo nötig ("L'avocate"),
#    siehe fragen.artikel_beruf; "de" vor einer Diagnose wird zu "d'"
#    ("souffrant d'asthme"), siehe fragen.praep_de. Diagnosen deshalb ohne
#    Artikel und so, dass "souffrant de …" passt.
#  - Berufe nur mit sichtbar verschiedener weiblicher Form (keine "dentiste",
#    "pilote", "juge" …): Das Geschlecht soll an der Berufsbezeichnung
#    erkennbar sein.
#  - Keine Excel-Datei: Die Wortlisten-Excel (scripts/wortliste.py) gibt es nur
#    für Deutsch. Diese Datei direkt bearbeiten.
# Noch von niemandem aus der Romandie durchgesehen.
# ==============================================================================

grammatik: fr

altersgruppen: [25, 35, 45, 55, 75]
altersgruppen_wahl: [18, 20, 22, 25, 28, 30, 32, 35, 38, 40, 42, 45, 48, 50, 52, 55, 58, 60, 62, 65, 68, 70, 72, 75]
