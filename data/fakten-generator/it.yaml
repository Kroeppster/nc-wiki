fragen:
  der:     { m: "Il", w: "La" }
  patient: { m: "paziente", w: "paziente" }
  anrede:  { m: "Il signor", w: "La signora" }
  # Artikel vor einem Beruf am Satzanfang: "Il cuoco", "La cuoca",
  # "L'avvocata", "Lo psicologo" (vor s + Konsonant, z, gn, ps …).
  artikel_beruf: { m: "Il", w: "La", vokal: "L'", m_lo: "Lo", h_stumm: true }
  # Wie im Beispiel der Anleitung: "Meier: circa 40 anni, poliziotta, nubile -
  # frattura dell'omero".
  alter_liste: "circa {alter} anni"
  zeile: "{beruf}, {merkmal} - {diagnose}"
  alter_antwort: "circa {alter} anni"
  typen:
    alter_von_diagnose:   "La persona con {diagnose} ha …"
    beruf_von_diagnose:   "La persona con {diagnose} è di professione …"
    name_von_diagnose:    "{Der} {Patient} con {diagnose} si chiama …"
    merkmal_von_diagnose: "{Der} {Patient} con {diagnose} è …"
    name_von_merkmal:     "{Der} {Patient} {merkmal_attr} si chiama …"
    diagnose_von_merkmal: "{Der} {Patient} {merkmal_attr} soffre di …"
    name_von_beruf:       "{Der_beruf} si chiama …"
    merkmal_von_beruf:    "{Der_beruf} è …"
    diagnose_von_beruf:   "{Der_beruf} soffre di …"
    beruf_von_name:       "{Anrede} {name} è di professione …"
    diagnose_von_name:    "{Anrede} {name} soffre di …"
    beruf_von_alter:      "{Der} {Patient} di {alter} anni è di professione …"
