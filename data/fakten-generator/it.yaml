# ==============================================================================
# WORTLISTEN FÜR DEN FAKTEN-GENERATOR - ITALIENISCH
# ==============================================================================
# Gleicher Aufbau wie de.yaml (dort steht die ausführliche Erklärung, warum die
# Kategorien wichtig sind). Unterschiede zum Deutschen:
#  - "grammatik: it": Merkmale haben eine Form je Geschlecht
#    ({ m: "nervoso", w: "nervosa" }; unveränderliche wie "gentile" bleiben ein
#    Wort) und stehen hinter dem Nomen ("Il paziente nervoso").
#  - Vor einem Beruf steht der passende Artikel ("Il medico", "Lo psicologo",
#    "L'avvocata", "La cuoca"), siehe fragen.artikel_beruf.
#  - In den Fragen steht die Diagnose mit Artikel ("La persona con l'asma"):
#    Diese Form steht unter "dativ" (der Name kommt aus dem Deutschen, wo dort
#    der Dativ steht). In der Einprägeliste und in den Antworten ohne Artikel.
#  - Berufe nur mit sichtbar verschiedener weiblicher Form (keine
#    "farmacista", "pilota", "insegnante" …): Das Geschlecht soll an der
#    Berufsbezeichnung erkennbar sein.
#  - Keine Excel-Datei: Die Wortlisten-Excel (scripts/wortliste.py) gibt es nur
#    für Deutsch. Diese Datei direkt bearbeiten.
# Noch von niemandem aus dem Tessin durchgesehen.
# ==============================================================================

