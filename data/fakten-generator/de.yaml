# ==============================================================================
# WORTLISTEN FÜR DEN FAKTEN-GENERATOR
# ==============================================================================
# Der Generator auf der Seite "Figuren & Fakten lernen" würfelt daraus immer
# neue Einpräge-Sets. Übungsmaterial für diesen Untertest ist EINMALIG
# verwendbar: Wer eine Serie einmal auswendig gelernt hat, kann sie nie wieder
# zum Üben brauchen. Deshalb ein Generator statt weiterer PDFs.
#
# HERKUNFT: ausgelesen aus den eigenen Übungsserien
# (assets/downloads/uebungsaufgaben/figuren-fakten-lernen/, Einprägephasen
# 2022 S02-S04) mit scripts/fakten-listen-auslesen.py. Es ist also eigenes
# Material, keine fremde Quelle.
#
# ------------------------------------------------------------------------------
# WARUM DIE KATEGORIEN WICHTIG SIND - bitte vor dem Ändern lesen
# ------------------------------------------------------------------------------
# Eine echte EMS-Serie würfelt NICHT. Sie ist konstruiert: Jede der fünf
# Altersgruppen bekommt genau eine Zahn-, eine Herz- und eine Knochenkrankheit,
# und die drei Berufe einer Gruppe gehören zum selben Feld (z.B. alle drei zur
# Luftfahrt). Genau das macht die Menge überhaupt lernbar - man merkt sich
# "die Luftfahrt-Gruppe ist die 45er".
#
# Ein Generator, der einfach zufällig zieht, erzeugt deutlich SCHWERERE Sets
# als das Original und übt damit etwas anderes als die Prüfung. Deshalb steht
# bei jeder Krankheit und jedem Beruf eine Kategorie, und der Generator zieht
# pro Altersgruppe aus je einer.
#
# ------------------------------------------------------------------------------
# NOCH ZU PRÜFEN (Stand: erste Fassung)
# ------------------------------------------------------------------------------
#  - Die Kategorien sind VORSORTIERT und von keinem Menschen freigegeben.
#  - "geschlecht" steuert nur die Formulierung der Fragen ("Die Tierärztin",
#    "Herr Walz"). Meist an der Endung -in erkannt; Sonderfälle wie Imker,
#    Stewardess oder Bauer/Bäuerin bitte durchsehen.
#  - Französisch und Italienisch fehlen noch ganz. Solange sie fehlen, zeigt
#    der Generator dort einen Hinweis statt eines Sets.
#  - Für echte Abwechslung wären ~80 Einträge je Kategorie gut; aktuell sind
#    es rund 40. Neue Wörter einfach unten in der passenden Kategorie ergänzen.
# ==============================================================================

# Die fünf Altersgruppen einer Serie. Genau fünf, zu je drei Personen = 15.
