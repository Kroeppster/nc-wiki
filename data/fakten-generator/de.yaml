# ==============================================================================
# FRAGEN - Wortlaut wie im Testheft 2026
# ==============================================================================
# Die Formulierungen stehen hier und nicht in i18n/, weil sie zur Grammatik
# der Sprache gehören wie die Wörter oben: "Der Urologe ist …", "Frau
# Kowalski ist …", "Die 55-jährige Patientin ist von Beruf …". Platzhalter:
#   {Der} {Patient} {Anrede}   je nach Geschlecht der Person (m/w, unten)
#   {diagnose} {name} {beruf} {alter}
#   {merkmal_attr}             das Merkmal vor dem Nomen: "der nervöse
#                              Patient". Gebildet wird es mit -e ("nervöse",
#                              "ledige"), bei -el ohne e ("sensibel" ->
#                              "sensible"). Merkmale, die so nicht gehen,
#                              stehen in "nicht_attributiv".
# Ein Fragetyp, der hier fehlt, wird nicht gestellt. Welche Angabe gefragt
# ist, steckt im Namen: alter_von_diagnose fragt nach dem Alter.
#
# Merkmale mit grossem Anfangsbuchstaben (Nomen wie "Notfall") kommen in
# keinem Set vor: "Der Urologe ist … Notfall" geht nicht, und als einzige
# Nomen unter lauter Adjektiven wären sie als Antwort sofort zu erkennen.
nicht_attributiv: ["durcheinander"]

# Diagnosen im Plural brauchen nach "mit" den Dativ: "Der Patient mit
# Herzproblemen", nicht "mit Herzprobleme". In der Einprägeliste bleibt die
# Grundform. Wer eine Diagnose im Plural ergänzt, trägt sie hier ein.
dativ:
  Herzprobleme: Herzproblemen
  Ohrgeräusche: Ohrgeräuschen

fragen:
  der:     { m: "Der", w: "Die" }
  patient: { m: "Patient", w: "Patientin" }
  anrede:  { m: "Herr", w: "Frau" }
  # So steht eine Person in der Einprägeliste (dritte Spalte) - wie im
  # Beispiel der Anleitung: "Meier: ca. 40 Jahre, Polizistin, ledig - Oberarmfraktur".
  alter_liste: "ca. {alter} Jahre"
  zeile: "{beruf}, {merkmal} - {diagnose}"
  # Antwort auf eine Frage nach dem Alter
  alter_antwort: "ca. {alter} Jahre alt"
  typen:
    alter_von_diagnose:   "Die Person mit {diagnose} ist …"
    beruf_von_diagnose:   "Die Person mit {diagnose} ist von Beruf …"
    name_von_diagnose:    "{Der} {Patient} mit {diagnose} heisst …"
    merkmal_von_diagnose: "{Der} {Patient} mit {diagnose} ist …"
    name_von_merkmal:     "{Der} {merkmal_attr} {Patient} heisst …"
    diagnose_von_merkmal: "{Der} {merkmal_attr} {Patient} hat …"
    name_von_beruf:       "{Der} {beruf} heisst …"
    merkmal_von_beruf:    "{Der} {beruf} ist …"
    diagnose_von_beruf:   "{Der} {beruf} hat …"
    beruf_von_name:       "{Anrede} {name} ist …"
    diagnose_von_name:    "{Anrede} {name} hat …"
    beruf_von_alter:      "{Der} {alter}-jährige {Patient} ist von Beruf …"
