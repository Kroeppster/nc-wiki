# NEWSLETTER: ANMELDEFORMULARE BEI BREVO (eines je Sprache)
# ============================================================================
# Die Seite «Einschreiben» (content/<sprache>/newsletter-einschreiben.md,
# «newsletter_form: true») zeigt ein eigenes Formular, das die Anmeldung an
# das Brevo-Formular ihrer Sprache schickt - damit landet die Person in der
# richtigen Liste (Newsletter DE/FR/IT) und bekommt die Bestätigungsmail in
# ihrer Sprache. Siehe docs/NEWSLETTER-BREVO.md.
#
# Woher die Adresse kommt: in Brevo das Formular öffnen → «Teilen» → «HTML»;
# im Code steht <form ... action="https://…sibforms.com/serve/…">. Genau diese
# Adresse hier eintragen. Sie ist nicht geheim (sie steht ohnehin im
# Quelltext jeder Seite mit Formular).
#
# Fehlt die Adresse einer Sprache, zeigt die Seite dort kein Formular, sondern
# nur ihren Text.
# ============================================================================

