# ============================================================================
# DIE 8 ÜBUNGSAUFGABEN-THEMEN AUF NCWIKI (nicht zu verwechseln mit den 9
# offiziell getakteten Untertests der echten EMS-Prüfung, siehe Hinweis unten)
# ============================================================================
# Wird an mehreren Stellen der Website verwendet: das nummerierte Kachel-
# Raster auf der Startseite (siehe layouts/partials/subtest-grid.html), sowie
# die Untertest-Liste, die bei einer bestimmten Frage in der Q&A-Seite
# automatisch angehängt wird (siehe data/faq.yaml, Eintrag mit
# "dynamic: subtests"). Diese Liste hier ist also die EINZIGE Stelle, an der
# diese Themen gepflegt werden müssen - überall sonst wird sie automatisch
# mitverwendet.
#
# Jeder Eintrag braucht:
#   number - die Position in diesem Raster (01-08), als Text mit führender Null
#   slug   - technischer Name für die Web-Adresse, z.B. "muster-zuordnen"
#            (muss zum entsprechenden Ordnernamen unter
#            content/<sprache>/ems/uebungsaufgaben/ passen)
#   de/fr/it - der angezeigte Name in den drei Sprachen (immer ausgeschrieben,
#            keine Abkürzungen)
#
# HINWEIS (2026-08-10): Es gab hier vorher zusätzlich einen 10. Eintrag
# "Testsimulationen" - das ist aber kein echter Untertest des EMS, sondern
# ein eigenes Angebot (ganze Testsimulationen, siehe /ems/testsimulationen/),
# und stand fälschlicherweise auch hier als Untertest-01-Kachel. Der
# migrierte News-Beitrag "Umstrukturierung des EMS ab 2022" bestätigt die
# echte Zahl: "Die 9 Aufgabengruppen blieben gleich" - der EMS hat also
# wirklich 9 Untertests, nicht 10.
#
# HINWEIS (2026-08-16): "Figuren einprägen" und "Fakten einprägen" wurden zu
# EINER gemeinsamen Übungsaufgaben-Seite "Figuren & Fakten lernen"
# zusammengelegt (beides Gedächtnisübungen mit sehr ähnlichem Ablauf) - diese
# Liste hier zählt deshalb nur noch 8 Einträge statt 9. Das ist eine reine
# Organisationsentscheidung für die ÜBUNGSSEITEN dieser Website: die echte
# EMS-Prüfung selbst hat nach wie vor 9 einzeln getaktete Untertests (siehe
# den Tagesablauf auf /ems/, wo Figuren und Fakten einprägen weiterhin als
# zwei separate, eigenständig bewertete Untertests aufgeführt sind).
# ============================================================================
