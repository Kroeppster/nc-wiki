# ============================================================================
# ABLAUF DES ECHTEN EMS-TESTTAGS (Reihenfolge und Bearbeitungszeiten)
# ============================================================================
# Diese Datei ist die EINZIGE Stelle, an der die Untertest-Zeiten gepflegt
# werden. Sie speist zwei Dinge:
#
#   1. Die Tabelle "Tagesablauf" auf /ems/ (in allen drei Sprachen) - erzeugt
#      über den Shortcode {{< testablauf >}}, siehe
#      layouts/shortcodes/testablauf.html. Vorher stand dieselbe Tabelle von
#      Hand in content/de|fr|it/ems/_index.md - also dreimal, mit dreimal der
#      Gefahr, dass eine geänderte Zeit irgendwo vergessen wird.
#   2. Den Prüfungsmodus auf /ems/pruefungsmodus/ (Uhr + Ansagen), siehe
#      layouts/partials/pruefungsmodus.html.
#
# WICHTIG: Ändert sich am echten EMS eine Bearbeitungszeit, wird sie HIER
# geändert - Tabelle und Prüfungsmodus ziehen automatisch mit. Eine Zeit, die
# hier falsch steht, ist ein echter Schaden: Jemand übt dann monatelang mit
# der falschen Dauer.
#
# Felder je Block:
#   key       - technischer Name, muss eindeutig sein (wird nirgends angezeigt)
#   slug      - Ordner unter content/<sprache>/ems/uebungsaufgaben/, damit der
#               Block auf die passende Übungsseite verlinken kann. Leer lassen,
#               wenn es keine passende Seite gibt.
#   minuten   - Bearbeitungszeit in Minuten (Zahl, keine Anführungszeichen)
#   aufgaben  - Anzahl Aufgaben als Text, oder "" wenn es keine gibt
#               (Einprägephasen werden nicht bewertet)
#   punkte    - Maximalpunktzahl als Text, oder ""
#   de/fr/it  - angezeigter Name in den drei Sprachen
#   hinweis_de/fr/it - optionaler Zusatzsatz, der im Prüfungsmodus nach der
#               allgemeinen Anweisung erscheint und mit vorgelesen wird.
#               Weglassen, wenn es nichts Besonderes zu sagen gibt.
#
# REIHENFOLGE = die echte Reihenfolge am Testtag. Der Prüfungsmodus spielt die
# Blöcke bei der kompletten Simulation genau so nacheinander ab.
#
# Quelle der Zeiten: der bisherige Tagesablauf auf /ems/ (Stand 2026-08).
# Zwischen den Untertests gibt es am echten EMS keine Pausen.
# ============================================================================

# Sekunden zwischen zwei Blöcken bei der kompletten Simulation: Zeit zum
# Umblättern und für die Anweisung zum nächsten Untertest. Am echten EMS gibt
# es dafür keine feste Dauer - der Wert ist eine bewusste Setzung, damit die
# Simulation ohne Klick durchläuft.
umblaettern_sekunden: 25

