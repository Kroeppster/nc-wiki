# Text der Gesamt-Zeile in der Tabelle. Die Gesamtzeit wird NICHT hier
# eingetragen, sondern aus den Minuten oben zusammengezählt - so kann sie gar
# nicht auseinanderlaufen. Nur die Aufgaben-/Punkte-Summe steht als Text hier,
# weil "144 + 1600 Zeichen" keine reine Zahl ist.
summe:
