# ============================================================================
# ANZEIGENAMEN FÜR AUTOMATISCH GEFUNDENE PDF-DOWNLOADS
# ============================================================================
# Testsimulationen, Kursskripte und Übungsserien werden automatisch aus den
# Ordnern unter assets/downloads/ aufgelistet (siehe
# layouts/partials/download-list.html) - ohne dass man dafür etwas in einer
# Textdatei eintragen müsste. Der angezeigte Name wird dabei normalerweise
# automatisch aus dem Dateinamen abgeleitet (z.B. "2027_Muster_A1.pdf" wird
# zu "Muster – A1 (2027)").
#
# Diese Datei hier ist NUR dafür da, diesen automatischen Namen bei Bedarf
# durch einen von Hand gewählten, schöneren Namen zu ersetzen - optional,
# nicht jede Datei braucht einen Eintrag hier.
#
# Key = Dateiname ohne Endung ".pdf", Wert = Anzeigename pro Sprache.
# Fehlt der Eintrag für die aktuelle Seitensprache, wird "de" verwendet.
#
# Die grosse Mehrheit der Einträge unten (Übungsserien-Archiv 2021-2026)
# wurde am 2026-08-09 automatisch beim Migrieren der alten Website erzeugt -
# nicht von Hand tippen, sondern bei neuen Serien einfach dem bestehenden
# Muster "<Jahr>_<Untertest-Ordnername>_S<Nummer>" folgen, dann greift auch
# die "Aufgabe + Lösung nebeneinander"-Anzeige automatisch (siehe
# assets/downloads/uebungsaufgaben/README.md).
#
# Beispiel:
# overrides:
#   UT3_A2_2026:
#     de: "Übungsserie UT3 – A2 2026"
#     fr: "Série d'exercices UT3 – A2 2026"
#     it: "Serie di esercizi UT3 – A2 2026"

