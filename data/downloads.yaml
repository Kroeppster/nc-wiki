# ============================================================================
# DOWNLOADS: NAMEN UND KENNZEICHNUNG
# ============================================================================
# Testsimulationen, Kursskripte und Übungsserien werden automatisch aus den
# Ordnern unter assets/downloads/ aufgelistet (siehe
# layouts/partials/download-list.html und download-gruppen.html) - ohne dass
# man dafür etwas in einer Textdatei eintragen müsste.
#
# ÜBUNGSSERIEN (assets/downloads/uebungsaufgaben/<untertest>/):
#   Dateiname "<Jahr>_<Untertest-Ordnername>_S<Nummer>.pdf" - daraus entsteht
#   automatisch "Serie 2" unter der Überschrift des Jahres. Eigene Lösungsdatei:
#   gleicher Name plus "_Loesung". Einprägephase bei Figuren/Fakten: gleicher
#   Name plus "_Einpraegephase".
#
# mit_loesung:
#   Dateinamen (ohne ".pdf") von Serien, bei denen die Lösung im selben PDF
#   steckt. Sie erhalten den Knopf "Aufgaben mit Lösung" statt "Aufgaben".
#
# overrides:
#   Anzeigenamen für alle anderen Dateien (Testhefte, Auswertungen,
#   Kursskripte ...). Key = Dateiname ohne ".pdf", Wert = Name pro Sprache
#   (fehlt die Sprache, gilt "de"). Bei Testsimulationen ohne Jahreszahl, weil
#   das Jahr als Überschrift darüber steht.
# ============================================================================

