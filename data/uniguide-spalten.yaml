# ============================================================================
# UNIGUIDE-SPALTEN: welche Angaben es zu jeder Universität gibt
# ============================================================================
# Die Werte selbst stehen in data/unis.yaml. Diese Datei legt fest, WELCHE
# Angaben es gibt, wie sie heissen und wo sie erscheinen - in der Tabelle, im
# Vergleich, auf der Uni-Seite und als Spalte im Blatt "Uniguide – Ansicht" der
# Textmappen. Die Reihenfolge hier ist die Reihenfolge überall.
#
# Die Textmappe schreibt diese Datei selbst, wenn dort ein Spaltenname
# geändert, eine Spalte angelegt oder gelöscht oder die Zeile "Anzeige"
# geändert wird. Kommentare zwischen den Einträgen gehen dabei verloren - nur
# dieser Kopf bleibt.
#
# Felder je Spalte:
#   feld     - technischer Name in data/unis.yaml (nicht ändern, sonst sind
#              die Werte weg)
#   titel    - Spaltenname je Sprache
#   art      - text (ein Satz), liste (mit Komma), punkte (je einer pro
#              Zeile), link, ems (ja/nein/teilweise), sprachen (Deutsch,
#              Français, Italiano), name (Name der Uni, mit Link)
#   sprachabhaengig - true: Wert je Sprache ({de: …, fr: …, it: …})
#   tabelle  - true: eigene Spalte in der grossen Tabelle
#   bereich  - wo auf der Uni-Seite und im Vergleich: zulassung, studium,
#              quellen, fuss (klein unten: Stand, Quelle) oder aus (nirgends
#              auf der Website, nur in der Textmappe)
#   fest     - true: wird von der Website gebraucht, lässt sich in der
#              Textmappe nicht löschen
#   fehlt    - true: ist der Wert leer, steht die Angabe auf der Uni-Seite
#              unter "Diese Angaben fehlen noch"
#   hinweis  - kleine Quellenangabe unter der Tabelle bzw. beim Wert, je
#              Sprache
#   breite   - Spaltenbreite in der Textmappe (Zeichen)
# ============================================================================


